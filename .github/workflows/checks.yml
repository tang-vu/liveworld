name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format:check
      - run: npm test
      - run: node scripts/check-generated-pair.mjs
      - run: node scripts/check-mechanics.mjs
      - run: node scripts/evaluate-rules.mjs
      - run: node scripts/check-agent-evidence.mjs
      - run: node scripts/evaluate-contracts.mjs
      - run: node scripts/record-creator-study.mjs
      - run: node scripts/check-creator-film.mjs
      - run: npm run evaluate
